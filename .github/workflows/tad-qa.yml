# Added by TAD (The Agnostic Dev). Checks TAD's pull requests before
# TAD reviews them: install, build and tests.
# Runs only on TAD's branches (tad/...). Optional: add a repository secret
# TAD_QA_ENV with the .env lines this app needs to build and start.
name: TAD QA
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tad-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: TAD QA
    if: startsWith(github.head_ref, 'tad/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: App settings
        env:
          TAD_QA_ENV: ${{ secrets.TAD_QA_ENV }}
        run: if [ -n "$TAD_QA_ENV" ]; then printf '%s\n' "$TAD_QA_ENV" >> .env; fi
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
          grep -q '^APP_KEY=.\+' .env || php artisan key:generate --force
          mkdir -p database && touch database/database.sqlite
          sed -i -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' -e '/^DB_DATABASE=/d' .env && grep -q '^DB_CONNECTION=' .env || echo 'DB_CONNECTION=sqlite' >> .env
      - name: Build
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Test
        run: |
          vendor/bin/phpunit
